// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Humla uses custom SpongyCastle JARs generated by its nested source tree.
// Build them before app tasks resolve Humla's runtime classpath, so a clean
// source archive does not depend on pre-generated binary files.
def spongyCastleDir = file('libraries/humla/libs/humla-spongycastle')
def spongyCastleWrapper = file('libraries/humla/gradlew')
def spongyCastleJars = files(
        'libraries/humla/libs/humla-spongycastle/prov/build/libs/prov-1.51.0.0.jar',
        'libraries/humla/libs/humla-spongycastle/pkix/build/libs/pkix-1.51.0.0.jar')
def buildHumlaSpongyCastle = tasks.register('buildHumlaSpongyCastle', Exec) {
    workingDir spongyCastleDir
    inputs.files(fileTree(spongyCastleDir) {
        exclude 'build/**', '.gradle/**'
    })
    outputs.files(spongyCastleJars)
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', spongyCastleWrapper.absolutePath, '--no-daemon', 'jar'
    } else {
        commandLine spongyCastleWrapper.absolutePath, '--no-daemon', 'jar'
    }
}

project(':app').tasks.configureEach {
    dependsOn(buildHumlaSpongyCastle)
}

project(':libraries:humla').tasks.configureEach {
    dependsOn(buildHumlaSpongyCastle)
}
